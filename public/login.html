<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Hotel Management</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { justify-content: center; align-items: center; background: var(--primary-blue); }
    .login-card { background: white; padding: 40px; border-radius: 8px; width: 350px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div class="login-card">
    <h2 style="text-align:center; margin-bottom:20px; color:var(--primary-blue)">Grand Hotel Login</h2>
    <div id="alert-box" class="alert"></div>
    <form id="login-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn" style="width:100%;">Login</button>
    </form>
  </div>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (res.ok) {
        window.location.href = '/dashboard.html';
      } else {
        showAlert(data.error, 'error');
      }
    });
  </script>
</body>
</html>
