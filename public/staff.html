<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Staff Accounts - Hotel Management</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="sidebar-container"></div>
  <div class="main-content">
    <header><h1>Staff Management (Admin)</h1></header>
    <div class="container">
      <div id="alert-box" class="alert"></div>
      <form id="staff-form">
        <h3>Create Staff Account</h3>
        <div class="form-group"><label>Username</label><input type="text" id="staff-username" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="staff-password" required></div>
        <div class="form-group"><label>Role</label>
          <select id="staff-role">
            <option value="Receptionist">Receptionist</option>
            <option value="Housekeeping">Housekeeping</option>
            <option value="Admin">Admin</option>
          </select>
        </div>
        <button type="submit" class="btn">Create Staff</button>
      </form>
      <table>
        <thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Created At</th></tr></thead>
        <tbody id="staff-table"></tbody>
      </table>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script>
    checkAuth();
    setupSidebar('staff');

    async function loadStaff() {
      const res = await fetch('/api/staff');
      if (!res.ok) return;
      const staff = await res.json();
      document.getElementById('staff-table').innerHTML = staff.map(s => `
        <tr><td>#${s.id}</td><td>${s.username}</td><td><span class="badge badge-clean">${s.role}</span></td><td>${s.created_at}</td></tr>
      `).join('');
    }

    document.getElementById('staff-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/staff', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('staff-username').value,
          password: document.getElementById('staff-password').value,
          role: document.getElementById('staff-role').value
        })
      });
      const data = await res.json();
      if (res.ok) { showAlert(data.message, 'success'); loadStaff(); } else { showAlert(data.error, 'error'); }
    });

    loadStaff();
  </script>
</body>
</html>
