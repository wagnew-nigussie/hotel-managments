<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guests - Hotel Management</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="sidebar-container"></div>
  <div class="main-content">
    <header><h1>Guest Records</h1></header>
    <div class="container">
      <table>
        <thead><tr><th>ID</th><th>Full Name</th><th>Phone</th><th>ID / Passport Number</th><th>Registered At</th></tr></thead>
        <tbody id="guests-table"></tbody>
      </table>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script>
    checkAuth();
    setupSidebar('guests');

    async function loadGuests() {
      const res = await fetch('/api/guests');
      const guests = await res.json();
      document.getElementById('guests-table').innerHTML = guests.map(g => `
        <tr><td>#${g.id}</td><td>${g.name}</td><td>${g.phone}</td><td>${g.id_number}</td><td>${g.created_at}</td></tr>
      `).join('');
    }
    loadGuests();
  </script>
</body>
</html>
