<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bookings - Hotel Management</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="sidebar-container"></div>
  <div class="main-content">
    <header><h1>Booking Management</h1></header>
    <div class="container">
      <div id="alert-box" class="alert"></div>
      <form id="booking-form">
        <h3>Create New Booking</h3>
        <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap: 15px;">
          <div class="form-group">
            <label>Room</label>
            <select id="room-select" required>
              <option value=""> Select Room </option>
            </select>
          </div>
          <div class="form-group"><label>Guest Full Name</label><input type="text" id="guest-name" required></div>
          <div class="form-group"><label>Phone Number</label><input type="text" id="phone" required></div>
          <div class="form-group"><label>ID / Passport Number</label><input type="text" id="id-number" required></div>
          <div class="form-group"><label>Check-In Date</label><input type="date" id="check-in" required></div>
          <div class="form-group"><label>Check-Out Date</label><input type="date" id="check-out" required></div>
        </div>
        <button type="submit" class="btn">Create Booking</button>
      </form>

      <h3>Existing Bookings</h3>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Room</th>
            <th>Guest</th>
            <th>Check-In</th>
            <th>Check-Out</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="bookings-table"></tbody>
      </table>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script>
    checkAuth();
    setupSidebar('bookings');

    async function init() {
      try {
        const roomRes = await fetch('/api/rooms');
        const rooms = await roomRes.json();

        const roomSelect = document.getElementById('room-select');
        roomSelect.innerHTML = '<option value="">Select Room </option>' +
          rooms.map(r => `<option value="${r.id}">Room ${r.room_number} - ${r.type} ($${r.price_per_night})</option>`).join('');

        loadBookings();
      } catch (error) {
        console.error('Error loading rooms:', error);
      }
    }

    async function loadBookings() {
      try {
        const res = await fetch('/api/bookings');
        const bookings = await res.json();
        document.getElementById('bookings-table').innerHTML = bookings.map(b => `
          <tr>
            <td>#${b.id}</td>
            <td>Room ${b.room_number}</td>
            <td>${b.guest_name}</td>
            <td>${b.check_in_date}</td>
            <td>${b.check_out_date}</td>
            <td><span class="badge badge-${b.status === 'checked-in' ? 'occupied' : 'clean'}">${b.status}</span></td>
          </tr>
        `).join('');
      } catch (error) {
        console.error('Error loading bookings:', error);
      }
    }

    document.getElementById('booking-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        roomId: document.getElementById('room-select').value,
        name: document.getElementById('guest-name').value,
        phone: document.getElementById('phone').value,
        idNumber: document.getElementById('id-number').value,
        checkIn: document.getElementById('check-in').value,
        checkOut: document.getElementById('check-out').value,
      };

      const res = await fetch('/api/bookings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (res.ok) {
        showAlert(data.message, 'success');
        loadBookings();
      } else {
        showAlert(data.error, 'error');
      }
    });

    init();
  </script>
</body>
</html>
