<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Billing & Payments - Hotel Management</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="sidebar-container"></div>
  <div class="main-content">
    <header><h1>Billing, Extras & Payments</h1></header>
    <div class="container">
      <div id="alert-box" class="alert"></div>
      <table>
        <thead><tr><th>Bill ID</th><th>Room</th><th>Guest</th><th>Total</th><th>Balance Due</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="bills-table"></tbody>
      </table>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script>
    checkAuth();
    setupSidebar('billing');

    async function loadBills() {
      const res = await fetch('/api/bills');
      const bills = await res.json();
      document.getElementById('bills-table').innerHTML = bills.map(b => `
        <tr>
          <td>#${b.id}</td>
          <td>Room ${b.room_number}</td>
          <td>${b.guest_name}</td>
          <td>$${b.total_amount.toFixed(2)}</td>
          <td>$${b.balance_due.toFixed(2)}</td>
          <td><span class="badge ${b.status === 'paid' ? 'badge-clean' : 'badge-dirty'}">${b.status}</span></td>
          <td>
            <button class="btn" onclick="addExtras(${b.id})">Add Extras</button>
            <button class="btn" style="background:var(--success);" onclick="payBill(${b.id}, ${b.balance_due})">Pay</button>
            <a href="/api/bills/${b.id}/pdf" class="btn" style="background:var(--gray); text-decoration:none; display:inline-block;" target="_blank">PDF</a>
          </td>
        </tr>
      `).join('');
    }

    async function addExtras(id) {
      const amount = prompt('Enter extras amount (Food, Laundry, etc.):');
      if (!amount) return;
      const res = await fetch(`/api/bills/${id}/extras`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ extrasAmount: amount })
      });
      if (res.ok) { showAlert('Extras added!', 'success'); loadBills(); }
    }

    async function payBill(id, maxDue) {
      const amount = prompt(`Enter payment amount (Balance Due: $${maxDue}):`, maxDue);
      if (!amount) return;
      const method = prompt('Payment method (cash, card, telebirr):', 'cash');
      if (!['cash', 'card', 'telebirr'].includes(method)) { alert('Invalid method'); return; }

      const res = await fetch(`/api/bills/${id}/pay`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: parseFloat(amount), method })
      });
      const data = await res.json();
      if (res.ok) { showAlert(data.message, 'success'); loadBills(); } else { showAlert(data.error, 'error'); }
    }

    loadBills();
  </script>
</body>
</html>
